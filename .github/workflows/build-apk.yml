name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Lerza Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies & Build Web App
        run: |
          if [ -f "package.json" ]; then
            echo "Building latest Web App from source..."
            npm install
            npm run build
          else
            echo "No root package.json detected, using committed pre-built assets."
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Web Dist to Android Assets
        run: |
          if [ -d "dist" ] && [ -d "app/src/main/assets" ]; then
            echo "Syncing fresh dist into app/src/main/assets..."
            rm -rf app/src/main/assets/assets
            cp -r dist/* app/src/main/assets/
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build APK with Gradle
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Locate and Collect Generated APK
        run: |
          mkdir -p release-output
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-output/Lerza-Player-v1.0.1-Debug.apk
            ls -lh release-output/Lerza-Player-v1.0.1-Debug.apk
          else
            echo "Error: No APK file found after build!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lerza-Player-v1.0.1-Debug-APK
          path: release-output/Lerza-Player-v1.0.1-Debug.apk
          retention-days: 30
