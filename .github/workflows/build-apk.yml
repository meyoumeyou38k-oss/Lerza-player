name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies & Build Web Assets
        run: |
          cd untitled-3
          npm install
          npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Sync Web Assets to Android
        run: |
          mkdir -p untitled-3/android/app/src/main/assets/public
          cp -r untitled-3/dist/* untitled-3/android/app/src/main/assets/public/ || true

      - name: Build Android APK with Gradle
        run: |
          cd untitled-3
          if [ -d "android" ]; then
            cd android
          fi
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Collect Generated APK
        run: |
          mkdir -p release-output
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release-output/LERZA-Player-v1.0.0-Debug.apk
          else
            echo "Error: No APK file found after build!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LERZA-Player-v1.0.0-Debug.apk
          path: release-output/LERZA-Player-v1.0.0-Debug.apk
          retention-days: 30
