name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # گٹ ہب سے ڈائریکٹ رن کے لیے

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Prepare & Sanitize Android Project
        run: |
          python3 - << 'EOF'
          import os, sys, shutil, zipfile, subprocess

          print("=== Step 1: Safely Extract All Zip Archives ===")
          extracted_any = True
          max_passes = 3
          p_count = 0

          while extracted_any and p_count < max_passes:
              extracted_any = False
              p_count += 1
              for root, dirs, files in os.walk('.'):
                  if '.git' in root:
                      continue
                  for file_name in files:
                      if file_name.lower().endswith('.zip'):
                          zip_path = os.path.join(root, file_name)
                          marker = zip_path + '.unpacked'
                          if not os.path.exists(marker):
                              print(f"Extracting: {zip_path}")
                              try:
                                  with zipfile.ZipFile(zip_path, 'r') as zf:
                                      zf.extractall(root)
                                  with open(marker, 'w') as mf:
                                      mf.write('extracted')
                                  extracted_any = True
                              except Exception as err:
                                  print(f"Warning extracting {zip_path}: {err}")

          print("=== Step 2: Locate Android Project ===")
          android_dir = None
          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root:
                  continue
              if 'settings.gradle' in files or 'settings.gradle.kts' in files:
                  android_dir = os.path.abspath(root)
                  break

          if not android_dir:
              for root, dirs, files in os.walk('.'):
                  if '.git' in root or 'node_modules' in root:
                      continue
                  if 'build.gradle' in files:
                      with open(os.path.join(root, 'build.gradle'), 'r', errors='ignore') as bf:
                          content = bf.read()
                          if 'com.android' in content or 'android {' in content:
                              if os.path.basename(root) == 'app':
                                  android_dir = os.path.abspath(os.path.dirname(root))
                              else:
                                  android_dir = os.path.abspath(root)
                              break

          if not android_dir:
              print("Generating fresh Android Project wrapper...")
              android_dir = os.path.abspath('fz-android-project')

          print(f"Selected Android Project Directory: {android_dir}")

          print("=== Step 3: Fix Theme & AndroidManifest Icon Handling ===")
          for root, dirs, files in os.walk(android_dir):
              if 'AndroidManifest.xml' in files:
                  manifest_path = os.path.join(root, 'AndroidManifest.xml')
                  with open(manifest_path, 'r', encoding='utf-8', errors='ignore') as mf:
                      m_content = mf.read()
                  
                  # اگر مینی فیسٹ میں آئیکن کا ٹیگ موجود نہ ہو یا مختلف ہو تو اس کو @mipmap/ic_launcher پر سیٹ کریں
                  if 'android:icon=' not in m_content:
                      m_content = m_content.replace('<application', '<application android:icon="@mipmap/ic_launcher"')
                  else:
                      m_content = m_content.replace('android:icon="@android:drawable/sym_def_app_icon"', 'android:icon="@mipmap/ic_launcher"')
                  
                  with open(manifest_path, 'w', encoding='utf-8') as mf:
                      mf.write(m_content)

              if 'themes.xml' in files:
                  theme_path = os.path.join(root, 'themes.xml')
                  with open(theme_path, 'r', encoding='utf-8', errors='ignore') as tf:
                      t_content = tf.read()
                  t_content = t_content.replace('Theme.MaterialComponents.DayNight.NoActionBar', 'Theme.AppCompat.DayNight.NoActionBar')
                  with open(theme_path, 'w', encoding='utf-8') as tf:
                      tf.write(t_content)

          # گریڈل میموری کنفگریشن
          props_path = os.path.join(android_dir, 'gradle.properties')
          with open(props_path, 'w', encoding='utf-8') as pf:
              pf.write("org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nandroid.nonTransitiveRClass=true\n")

          env_file = os.getenv('GITHUB_ENV')
          if env_file:
              with open(env_file, 'a') as ef:
                  ef.write(f"ANDROID_DIR={android_dir}\n")
          EOF

      - name: Apply Custom App Icon
        run: |
          python3 - << 'EOF'
          import os, shutil

          android_dir = os.getenv('ANDROID_DIR', '.')
          icon_source = None

          # گٹ ہب ریپوزیٹری کی جڑ (Root) میں آئیکن فائل تلاش کریں
          possible_icons = ['icon.png', 'icon.jpg', 'app-icon.png', 'logo.png']
          for icon_name in possible_icons:
              if os.path.exists(icon_name):
                  icon_source = os.path.abspath(icon_name)
                  break

          if icon_source:
              print(f"Found Custom Icon at: {icon_source}")
              # پروجیکٹ کے اندر res فولڈر تلاش کریں
              for root, dirs, files in os.walk(android_dir):
                  if root.endswith('src/main/res') or root.endswith('src/main/res/'):
                      mipmap_folders = ['mipmap-hdpi', 'mipmap-mdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi', 'mipmap']
                      for mf in mipmap_folders:
                          target_dir = os.path.join(root, mf)
                          os.makedirs(target_dir, exist_ok=True)
                          target_file = os.path.join(target_dir, 'ic_launcher.png')
                          shutil.copyfile(icon_source, target_file)
                          print(f"Copied icon to: {target_file}")
          else:
              print("No custom icon file found in root directory! (e.g., icon.png)")
          EOF

      - name: Build Android APK with Gradle 8.4
        run: |
          cd "$ANDROID_DIR"
          echo "=== Building APK inside $ANDROID_DIR ==="
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew || true
            ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate and Collect Generated APK
        run: |
          echo "=== Searching for generated APK ==="
          mkdir -p release-output
          APK_PATH=$(find "$ANDROID_DIR" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          fi

          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-output/FZ-Player-v1.0.0-Debug.apk
            ls -lh release-output/FZ-Player-v1.0.0-Debug.apk
          else
            echo "Error: No APK file found after build!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FZ-Player-v1.0.0-Debug-APK
          path: release-output/FZ-Player-v1.0.0-Debug.apk
          retention-days: 30

      - name: Build Complete
        run: |
          echo "================================================================="
          echo "  SUCCESS! APK is ready to download from the Actions Summary tab."
          echo "================================================================="
          
