name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Lerza Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract Zip File if Present
        run: |
          if [ -f "app-studio.zip" ]; then
            echo "Unzipping app-studio.zip..."
            unzip -o app-studio.zip
          fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies & Build Web App
        run: |
          if [ -d "app-studio" ]; then
            cd app-studio
          fi
          if [ -f "package.json" ]; then
            echo "Building Web App..."
            npm install
            npm run build
          else
            echo "No package.json found, skipping npm build."
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sync Web Dist to Android Assets
        run: |
          ROOT_DIR=$(pwd)
          if [ -d "$ROOT_DIR/dist" ] && [ -d "$ROOT_DIR/app-studio/app/src/main/assets" ]; then
            echo "Syncing dist to app-studio/app/src/main/assets..."
            cp -r $ROOT_DIR/dist/* $ROOT_DIR/app-studio/app/src/main/assets/
          elif [ -d "$ROOT_DIR/app-studio/dist" ] && [ -d "$ROOT_DIR/app-studio/app/src/main/assets" ]; then
            echo "Syncing app-studio/dist to app-studio/app/src/main/assets..."
            cp -r $ROOT_DIR/app-studio/dist/* $ROOT_DIR/app-studio/app/src/main/assets/
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -d "app-studio" ]; then
            cd app-studio
          fi
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Error: gradlew file not found!"
            pwd
            ls -la
            exit 1
          fi

      - name: Build APK with Gradle
        run: |
          if [ -d "app-studio" ]; then
            cd app-studio
          fi
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Locate and Collect Generated APK
        run: |
          mkdir -p release-output
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" release-output/Lerza-Player-v1.0-debug.apk
            ls -la release-output/Lerza-Player-v1.0-debug.apk
          else
            echo "Error: No APK file found after build!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lerza-Player-v1.0-Debug-APK
          path: '**/release-output/Lerza-Player-v1.0-debug.apk'
          retention-days: 0
